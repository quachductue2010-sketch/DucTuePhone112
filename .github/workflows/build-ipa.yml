name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          xcodebuild \
            -project DucTuePhone101.xcodeproj \
            -scheme DucTuePhone101 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DucTuePhone101.app Payload/
          zip -r DucTuePhone101.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DucTuePhone101-IPA
          path: DucTuePhone101.ipa
